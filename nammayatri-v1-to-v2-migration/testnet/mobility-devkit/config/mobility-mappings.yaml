                    "components": [$map($ord.quote.breakup, function($b) {{
                      "type": $pcType($b.title),
                      "value": $number($b.price.value),
                      "currency": $b.price.currency,
                      "description": $b.title
                    }})]
                  },
                  "createdAt": $ord.created_at,
                  "updatedAt": $ord.updated_at
                }
              }]
            }
          }
        }
      )

