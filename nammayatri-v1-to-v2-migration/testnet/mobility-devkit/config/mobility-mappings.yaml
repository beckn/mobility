mappings:

  # ─────────────────────────────────────────────────────────────────────────────
  # search  (legacy — V1 systems now use discover/on_discover action names)
  # discover (BAP side: V1 discover → V2 discover; BPP side: V2 discover → V1 discover)
  # ─────────────────────────────────────────────────────────────────────────────

  search:
    bapMappings: |
      $
    bppMappings: |
      $

  discover:
    bapMappings: |
      (
        $ctx := $.context;
        $msg := $.message;
        {
          "context": {
            "version": "2.0.0",
            "action": "discover",
            "networkId": $ctx.domain,
            "bapId": $ctx.bap_id,
            "bapUri": $ctx.bap_uri,
            "bppId": $ctx.bpp_id,
            "bppUri": $ctx.bpp_uri,
            "transactionId": $ctx.transaction_id,
            "messageId": $ctx.message_id,
            "timestamp": $ctx.timestamp,
            "ttl": $ctx.ttl
          },
          "message": {
            "intent": {
              "filters": {
                "type": "jsonpath",
                "expression": $string($msg.intent)
              }
            }
          }
        }
      )
    bppMappings: |
      (
        $ctx    := $.context;
        $msg    := $.message;
        $domain := $ctx.networkId;
        $v1Intent := $eval($msg.intent.filters.expression);
        {
          "context": {
            "version": "2.1.0",
            "action": "discover",
            "domain": $domain,
            "bap_id": $ctx.bapId,
            "bap_uri": $ctx.bapUri,
            "bpp_id": $ctx.bppId,
            "bpp_uri": $ctx.bppUri,
            "transaction_id": $ctx.transactionId,
            "message_id": $ctx.messageId,
            "timestamp": $ctx.timestamp,
            "ttl": $ctx.ttl
          },
          "message": {
            "intent": $v1Intent
          }
        }
      )

  # ─────────────────────────────────────────────────────────────────────────────
  # on_search  (legacy — V1 systems now use on_discover action name)
  # on_discover (BPP side: V1 on_discover → V2 on_discover; BAP side: V2 on_discover → V1 on_discover)
  # ─────────────────────────────────────────────────────────────────────────────

  on_search:
    bapMappings: |
      $
    bppMappings: |
      $

  on_discover:
    bapMappings: |
      (
        $ctx      := $.context;
        $catalogs := $.message.catalogs;
        $domain   := $ctx.networkId;

        $coordsToGps := function($coords) {
          $string($coords[1]) & ", " & $string($coords[0])
        };

        $mapCatalog := function($cat) {(
          $provider := $cat.provider;
          $provAttrs := $provider.providerAttributes;

          $mapV1CancellationTerm := function($term) {{
            "fulfillment_state": { "descriptor": { "code": $term.fulfillmentStateCode } },
            "reason_required": $term.reasonRequired
          }};

          $mapOfferToItem := function($offer) {(
            $res   := $cat.resources[id = $offer.resourceIds[0]][0];
            $oAttr := $offer.offerAttributes;
            $ca    := $offer.considerations[0].considerationAttributes;
            $itemVehicleTags := $oAttr.tags[descriptor.code = "VEHICLE_INFO" and display != true];
            $otherItemTags := $oAttr.tags[descriptor.code != "VEHICLE_INFO"];
            $itemTags := $append($append($itemVehicleTags, $oAttr.pricingModel.tags), $otherItemTags);
            $merge([
              {
                "id": $offer.id,
                "descriptor": {
                  "code": $res.descriptor.code,
                  "name": $res.descriptor.name,
                  "short_desc": $res.descriptor.shortDesc
                },
                "category_ids": $oAttr.categoryIds,
                "fulfillment_ids": [$offer.id],
                "price": $merge([
                  { "currency": $ca.currency },
                  $exists($ca.estimatedAmount) ? { "value": $string($ca.estimatedAmount) } : {},
                  $exists($ca.minimumAmount)   ? { "minimum_value": $string($ca.minimumAmount) } : {},
                  $exists($ca.maximumAmount)   ? { "maximum_value": $string($ca.maximumAmount) } : {},
                  $exists($ca.offeredAmount)   ? { "offered_value": $string($ca.offeredAmount) } : {},
                  $exists($ca.value)           ? { "value": $string($ca.value) } : {},
                  $exists($ca.minimumValue)    ? { "minimum_value": $ca.minimumValue } : {},
                  $exists($ca.maximumValue)    ? { "maximum_value": $ca.maximumValue } : {},
                  $exists($ca.offeredValue)    ? { "offered_value": $ca.offeredValue } : {}
                ])
              },
              $itemTags                ? { "tags": [$itemTags] }                          : {},
              $oAttr.cancellationTerms ? { "cancellation_terms": [$map($oAttr.cancellationTerms, $mapV1CancellationTerm)] } : {}
            ])
          )};

          $mapOfferToFulfillment := function($offer) {(
            $res   := $cat.resources[id = $offer.resourceIds[0]][0];
            $oAttr := $offer.offerAttributes;
            $rAttr := $res.resourceAttributes;
            $g0    := $rAttr.origin.geo.coordinates;
            $g1    := $rAttr.destination.geo.coordinates;
            $vehicleInfoTag := $oAttr.tags[descriptor.code = "VEHICLE_INFO" and display = true][0];
            $merge([
              {
                "id": $offer.id,
                "type": $oAttr.fulfillmentType,
                "vehicle": $merge([
                  $oAttr.vehicle.category ? { "category": $oAttr.vehicle.category } : {},
                  $oAttr.vehicle.bodyType ? { "variant": $oAttr.vehicle.bodyType } : {},
                  $oAttr.vehicle.seatingCapacity ? { "capacity": $oAttr.vehicle.seatingCapacity } : {},
                  $oAttr.vehicleCategory ? { "category": $oAttr.vehicleCategory } : {},
                  $oAttr.vehicleVariant ? { "variant": $oAttr.vehicleVariant } : {},
                  $oAttr.seatingCapacity ? { "capacity": $oAttr.seatingCapacity } : {}
                ]),
                "stops": [
                  $merge([
                    { "id": "0", "type": "START" },
                    $g0 ? { "location": { "gps": $coordsToGps($g0) } } : {},
                    $rAttr.requestedTime ? { "time": { "timestamp": $rAttr.requestedTime } } : {}
                  ]),
                  $merge([
                    { "id": "1", "type": "END", "parent_stop_id": "0" },
                    $g1 ? { "location": { "gps": $coordsToGps($g1) } } : {}
                  ])
                ]
              },
              $vehicleInfoTag ? {
                "tags": [$vehicleInfoTag]
              } : (($exists($oAttr.serviceClass.isAirConditioned) or $exists($oAttr.serviceClass.airConditioningScore) or $exists($oAttr.isAirConditioned) or $exists($oAttr.airConditioningScore)) ? {
                "tags": [{
                  "descriptor": { "code": "VEHICLE_INFO", "name": "Vehicle info" },
                  "display": true,
                  "list": $filter([
                    $exists($oAttr.serviceClass.isAirConditioned) or $exists($oAttr.isAirConditioned) ? {
                      "descriptor": { "code": "IS_AIR_CONDITIONED_VEHICLE", "name": "Is air conditioned vehicle" },
                      "display": true,
                      "value": $string($exists($oAttr.serviceClass.isAirConditioned) ? $oAttr.serviceClass.isAirConditioned : $oAttr.isAirConditioned)
                    } : null,
                    $exists($oAttr.serviceClass.airConditioningScore) or $exists($oAttr.airConditioningScore) ? {
                      "descriptor": { "code": "IS_AIR_CONDITIONED", "name": "Is air conditioned" },
                      "display": true,
                      "value": $string($exists($oAttr.serviceClass.airConditioningScore) ? $oAttr.serviceClass.airConditioningScore : $oAttr.airConditioningScore)
                    } : null
                  ], function($t) { $type($t) != "null" })
                }]
              } : {})
            ])
          )};

          $catIds := $distinct($cat.offers.offerAttributes.categoryIds[]);

          $merge([
            {
              "id": $provider.id,
              "descriptor": { "name": $provider.descriptor.name },
              "categories": [$map($catIds, function($cid) {{
                "id": $cid,
                "descriptor": { "code": $cid, "name": $cid }
              }})],
              "fulfillments": $map($cat.offers, $mapOfferToFulfillment),
              "items": $map($cat.offers, $mapOfferToItem),
              "locations": $provider.locations ? $provider.locations : []
            },
            $cat.bppId  ? { "bpp_id": $cat.bppId }   : {},
            $cat.bppUri ? { "bpp_uri": $cat.bppUri } : {},
            $provAttrs ? {
              "payments": [{
                "collected_by": $provAttrs.collectedBy,
                "status": $provAttrs.paymentStatus,
                "type": $provAttrs.paymentType,
                "tags": $provAttrs.tags
              }]
            } : {}
          ])
        )};

        {
          "context": {
            "version": "2.1.0",
            "action": "on_discover",
            "domain": $domain,
            "bap_id":  $ctx.bapId,
            "bap_uri": $ctx.bapUri,
            "bpp_id":  $ctx.bppId,
            "bpp_uri": $ctx.bppUri,
            "transaction_id": $ctx.transactionId,
            "message_id": $ctx.messageId,
            "timestamp": $ctx.timestamp,
            "ttl": $ctx.ttl
          },
          "message": {
            "catalog": {
              "descriptor": { "name": $catalogs[0].descriptor.name },
              "providers": [$map($catalogs, $mapCatalog)]
            }
          }
        }
      )
    bppMappings: |
      (
        $ctx      := $.context;
        $catalog  := $.message.catalog;
        $stCtx    := "https://schema.beckn.io/SettlementTerm/v2.1/context.jsonld";
        $tripCtx  := "https://schema.beckn.io/TripRequest/v2.2/context.jsonld";
        $rideCtx  := "https://schema.beckn.io/RideOption/v2.1/context.jsonld";
        $fareCtx  := "https://schema.beckn.io/FareEstimate/v2.1/context.jsonld";

        $gpsToCoords := function($gps) {(
          $p := $split($gps, ",");
          [$number($trim($p[1])), $number($trim($p[0]))]
        )};
        $tagVal := function($tags, $group, $code) {
          $tags[descriptor.code = $group].list[descriptor.code = $code].value
        };
        $boolVal := function($v) {
          $v = true or $v = "true" or $v = "True" or $v = "TRUE"
        };
        $mapCancellationTerm := function($term) {{
          "fulfillmentStateCode": $term.fulfillment_state.descriptor.code,
          "reasonRequired": $term.reason_required
        }};

        $parts  := $split($ctx.domain & ":dummy:" & $ctx.location.country.code & ":" & $ctx.location.city.code, ":dummy:");
        $domain := $parts[0];

        $makeCatalog := function($provider) {(
          $payment := $provider.payments[0];
          $stTags  := $payment.tags;

          $mapItemPair := function($item) {(
            $ful   := $provider.fulfillments[id = $item.fulfillment_ids[0]][0];
            $s0    := $ful.stops[type = "START"][0];
            $s1    := $ful.stops[type = "END"][0];
            $g0    := $s0.location.gps;
            $g1    := $s1.location.gps;
            $price := $item.price;
            $vehicleTags := $ful.tags[descriptor.code = "VEHICLE_INFO"];
            $vehicleIconUrl := $tagVal($item.tags, "VEHICLE_INFO", "VEHICLE_ICON_URL");
            $tipOptions := $tagVal($item.tags, "INFO", "TIP_OPTIONS");
            $blockedSearchRoute := $tagVal($item.tags, "INFO", "IS_BLOCKED_SEARCH_ROUTE");
            $preferredSearchRoute := $tagVal($item.tags, "INFO", "IS_CUSTOMER_PREFFERED_SEARCH_ROUTE");
            $featureName := $tagVal($item.tags, "FEATURE_LIST", "FEATURE_NAME");
            $featureValue := $tagVal($item.tags, "FEATURE_LIST", "FEATURE_VALUE");
            $fareTags := $item.tags[descriptor.code = "FARE_POLICY"];
            $fareVal := function($code) { $tagVal($item.tags, "FARE_POLICY", $code) };
            $offerTags := $append($ful.tags, $item.tags[descriptor.code != "FARE_POLICY"]);
            $ofAttrs := {
              "@context": $rideCtx,
              "@type": "RideOption",
              "categoryIds": $item.category_ids,
              "vehicleType": { "vehicleCategoryCode": "FOUR_WHEELER" },
              "vehicle": $merge([
                $ful.vehicle.variant ? { "bodyType": $ful.vehicle.variant } : {},
                $ful.vehicle.capacity ? { "seatingCapacity": $ful.vehicle.capacity } : {},
                $ful.vehicle.category ? { "category": $ful.vehicle.category } : {},
                $vehicleIconUrl ? { "iconUrl": $vehicleIconUrl } : {}
              ]),
              "serviceClass": $merge([
                $item.descriptor.code ? { "serviceClassCode": $item.descriptor.code } : {},
                $exists($vehicleTags.list[descriptor.code = "IS_AIR_CONDITIONED_VEHICLE"].value) ? { "isAirConditioned": $boolVal($vehicleTags.list[descriptor.code = "IS_AIR_CONDITIONED_VEHICLE"].value) } : {},
                $exists($vehicleTags.list[descriptor.code = "IS_AIR_CONDITIONED"].value) ? { "airConditioningScore": $number($vehicleTags.list[descriptor.code = "IS_AIR_CONDITIONED"].value) } : {}
              ]),
              "fulfillmentType": $ful.type,
              "tipOptions": $tipOptions,
              "isBlockedSearchRoute": $boolVal($blockedSearchRoute),
              "isCustomerPreferredSearchRoute": $boolVal($preferredSearchRoute),
              "featureList": $featureName ? [{
                "featureName": $featureName,
                "featureValue": $featureValue
              }] : undefined,
              "tags": $offerTags,
              "cancellationTerms": $map($item.cancellation_terms, $mapCancellationTerm),
              "pricingModel": $merge([
                { "currency": $price.currency },
                $fareVal("CANCELLATION_CHARGES") ? { "cancellationCharges": $fareVal("CANCELLATION_CHARGES") } : {},
                $fareVal("DRIVER_MIN_EXTRA_FEE") ? { "driverMinExtraFee": $fareVal("DRIVER_MIN_EXTRA_FEE") } : {},
                $fareVal("DRIVER_MAX_EXTRA_FEE") ? { "driverMaxExtraFee": $fareVal("DRIVER_MAX_EXTRA_FEE") } : {},
                $fareVal("PET_CHARGES") ? { "petCharges": $fareVal("PET_CHARGES") } : {},
                $fareVal("NIGHT_SHIFT_START_TIME") ? { "nightShiftStartTime": $fareVal("NIGHT_SHIFT_START_TIME") } : {},
                $fareVal("NIGHT_SHIFT_END_TIME") ? { "nightShiftEndTime": $fareVal("NIGHT_SHIFT_END_TIME") } : {},
                $fareVal("NIGHT_SHIFT_START_TIME_IN_SECONDS") ? { "nightShiftStartTimeInSeconds": $fareVal("NIGHT_SHIFT_START_TIME_IN_SECONDS") } : {},
                $fareVal("NIGHT_SHIFT_END_TIME_IN_SECONDS") ? { "nightShiftEndTimeInSeconds": $fareVal("NIGHT_SHIFT_END_TIME_IN_SECONDS") } : {},
                $fareVal("CONGESTION_CHARGE_PERCENTAGE") ? { "congestionChargePercentage": $fareVal("CONGESTION_CHARGE_PERCENTAGE") } : {},
                $fareVal("CUSTOMER_EXTRA_FEE_TAX_MULTIPLIER") ? { "customerExtraFeeTaxMultiplier": $fareVal("CUSTOMER_EXTRA_FEE_TAX_MULTIPLIER") } : {},
                $fareVal("BASE_DISTANCE") ? { "baseDistance": $fareVal("BASE_DISTANCE") } : {},
                $fareVal("BASE_FARE") ? { "baseFare": $fareVal("BASE_FARE") } : {},
                $fareVal("DEAD_KILOMETER_FARE") ? { "deadKilometerFare": $fareVal("DEAD_KILOMETER_FARE") } : {},
                $fareVal("EXTRA_PER_KM_FARE") ? { "extraPerKmFare": $fareVal("EXTRA_PER_KM_FARE") } : {},
                $fareVal("EXTRA_PER_KM_STEP_FARE_3000_Above") ? { "extraPerKmStepFare3000Above": $fareVal("EXTRA_PER_KM_STEP_FARE_3000_Above") } : {},
                $fareVal("WAITING_CHARGE_PER_MIN") ? { "waitingChargePerMin": $fareVal("WAITING_CHARGE_PER_MIN") } : {},
                $fareVal("WAITING_CHARGE_RATE_PER_MIN") ? { "waitingChargeRatePerMin": $fareVal("WAITING_CHARGE_RATE_PER_MIN") } : {},
                $fareVal("FREE_WAITING_TIME_IN_MINUTES") ? { "freeWaitingTimeInMinutes": $fareVal("FREE_WAITING_TIME_IN_MINUTES") } : {},
                $fareVal("NIGHT_SHIFT_CHARGE") ? { "nightShiftCharge": $fareVal("NIGHT_SHIFT_CHARGE") } : {},
                $fareVal("NIGHT_SHIFT_CHARGE_PERCENTAGE") ? { "nightShiftChargePercentage": $fareVal("NIGHT_SHIFT_CHARGE_PERCENTAGE") } : {},
                $fareVal("DRIVER_EXTRA_FEE_BOUNDS_STEP_MIN_FEE_0_Above") ? { "driverExtraFeeBoundsStepMinFee0Above": $fareVal("DRIVER_EXTRA_FEE_BOUNDS_STEP_MIN_FEE_0_Above") } : {},
                $fareVal("DRIVER_EXTRA_FEE_BOUNDS_STEP_MAX_FEE_0_Above") ? { "driverExtraFeeBoundsStepMaxFee0Above": $fareVal("DRIVER_EXTRA_FEE_BOUNDS_STEP_MAX_FEE_0_Above") } : {},
                $fareVal("RIDE_FARE_DISCOUNT_APPLICABLE_TAX_EXCLUSIVE") ? { "rideFareDiscountApplicableTaxExclusive": $fareVal("RIDE_FARE_DISCOUNT_APPLICABLE_TAX_EXCLUSIVE") } : {},
                $fareVal("RIDE_FARE_DISCOUNT_APPLICABLE_TAX") ? { "rideFareDiscountApplicableTax": $fareVal("RIDE_FARE_DISCOUNT_APPLICABLE_TAX") } : {},
                $fareVal("RIDE_FARE_NON_DISCOUNT_APPLICABLE_TAX_EXCLUSIVE") ? { "rideFareNonDiscountApplicableTaxExclusive": $fareVal("RIDE_FARE_NON_DISCOUNT_APPLICABLE_TAX_EXCLUSIVE") } : {},
                $fareVal("RIDE_FARE_NON_DISCOUNT_APPLICABLE_TAX") ? { "rideFareNonDiscountApplicableTax": $fareVal("RIDE_FARE_NON_DISCOUNT_APPLICABLE_TAX") } : {},
                $fareVal("TOLL_FARE_TAX_EXCLUSIVE") ? { "tollFareTaxExclusive": $fareVal("TOLL_FARE_TAX_EXCLUSIVE") } : {},
                $fareVal("TOLL_FARE_TAX") ? { "tollFareTax": $fareVal("TOLL_FARE_TAX") } : {},
                $fareVal("CANCELLATION_FEE_TAX_EXCLUSIVE") ? { "cancellationFeeTaxExclusive": $fareVal("CANCELLATION_FEE_TAX_EXCLUSIVE") } : {},
                $fareVal("CANCELLATION_TAX") ? { "cancellationTax": $fareVal("CANCELLATION_TAX") } : {},
                $fareVal("PARKING_CHARGE_TAX_EXCLUSIVE") ? { "parkingChargeTaxExclusive": $fareVal("PARKING_CHARGE_TAX_EXCLUSIVE") } : {},
                $fareVal("PARKING_CHARGE_TAX") ? { "parkingChargeTax": $fareVal("PARKING_CHARGE_TAX") } : {},
                $fareTags ? { "tags": [$fareTags] } : {}
              ])
            };
            {
              "resource": {
                "id": $item.id,
                "descriptor": {
                  "name": $item.descriptor.name,
                  "code": $item.descriptor.code,
                  "shortDesc": $item.descriptor.short_desc
                },
                "quantity": { "value": 1, "unit": "trip" },
                "resourceAttributes": {
                  "@context": $tripCtx,
                  "@type": "TripRequest",
                  "requestedTime": $s0.time.timestamp,
                  "origin": {
                    "geo": { "type": "Point", "coordinates": $gpsToCoords($g0) }
                  },
                  "destination": {
                    "geo": { "type": "Point", "coordinates": $gpsToCoords($g1) }
                  }
                }
              },
              "offer": {
                "id": $item.id,
                "descriptor": {
                  "code": $item.descriptor.code,
                  "name": $item.descriptor.name,
                  "shortDesc": $item.descriptor.short_desc
                },
                "resourceIds": [$item.id],
                "considerations": [{
                  "id": "con-" & $item.id,
                  "status": { "code": "PRICE_ESTIMATE", "name": "Fare estimate" },
                  "considerationAttributes": $merge([
                    {
                      "@context": $fareCtx,
                      "@type": "FareEstimate",
                      "currency": $price.currency
                    },
                    $price.value         ? { "estimatedAmount": $number($price.value) }       : {},
                    $price.minimum_value ? { "minimumAmount": $number($price.minimum_value) } : {},
                    $price.maximum_value ? { "maximumAmount": $number($price.maximum_value) } : {},
                    $price.offered_value ? { "offeredAmount": $number($price.offered_value) } : {}
                  ])
                }],
                "offerAttributes": $ofAttrs
              }
            }
          )};

          $pairs := $map($provider.items, $mapItemPair);

          {
            "id": $provider.id,
            "descriptor": { "name": $provider.descriptor.name },
            "provider": {
              "id": $provider.id,
              "descriptor": { "name": $provider.descriptor.name },
              "providerAttributes": {
                "@context": $stCtx,
                "@type": "SettlementTerm",
                "collectedBy": $payment.collected_by,
                "paymentStatus": $payment.status,
                "paymentType": $payment.type,
                "buyerFinderFeesPercentage": $payment.tags[descriptor.code = "BUYER_FINDER_FEES"].list[descriptor.code = "BUYER_FINDER_FEES_PERCENTAGE"].value,
                "settlementWindow": $payment.tags[descriptor.code = "SETTLEMENT_TERMS"].list[descriptor.code = "SETTLEMENT_WINDOW"].value,
                "delayInterest": $payment.tags[descriptor.code = "SETTLEMENT_TERMS"].list[descriptor.code = "DELAY_INTEREST"].value,
                "settlementBasis": $payment.tags[descriptor.code = "SETTLEMENT_TERMS"].list[descriptor.code = "SETTLEMENT_BASIS"].value,
                "mandatoryArbitration": $payment.tags[descriptor.code = "SETTLEMENT_TERMS"].list[descriptor.code = "MANDATORY_ARBITRATION"].value = "TRUE",
                "courtJurisdiction": $payment.tags[descriptor.code = "SETTLEMENT_TERMS"].list[descriptor.code = "COURT_JURISDICTION"].value,
                "staticTerms": $payment.tags[descriptor.code = "SETTLEMENT_TERMS"].list[descriptor.code = "STATIC_TERMS"].value,
                "tags": $payment.tags
              }
            },
            "resources": $pairs.resource,
            "offers": $pairs.offer
          }
        )};

        {
          "context": {
            "version": "2.0.0",
            "action": "on_discover",
            "networkId": $ctx.domain,
            "bapId": $ctx.bap_id,
            "bapUri": $ctx.bap_uri,
            "bppId": $ctx.bpp_id,
            "bppUri": $ctx.bpp_uri,
            "transactionId": $ctx.transaction_id,
            "messageId": $ctx.message_id,
            "timestamp": $ctx.timestamp,
            "ttl": $ctx.ttl
            ,
            "schemaContext": [
              $tripCtx,
              $rideCtx,
              $fareCtx,
              $stCtx
            ]
          },
          "message": {
            "catalogs": [$map($catalog.providers, $makeCatalog)]
          }
        }
      )

  # ─────────────────────────────────────────────────────────────────────────────
  # select
  # ─────────────────────────────────────────────────────────────────────────────

  select:
    bapMappings: |
      (
        $ctx  := $.context;
        $ord  := $.message.order;
        $ful  := $ord.fulfillments[0];
        $item := $ord.items[0];
        $tripCtx := "https://schema.beckn.io/TripRequest/v2.2/context.jsonld";
        $serviceCtx := "https://schema.beckn.io/ServiceClass/v2.1/context.jsonld";
        $passCtx := "https://schema.beckn.io/Passenger/v2.1/context.jsonld";
        $stCtx := "https://schema.beckn.io/SettlementTerm/v2.1/context.jsonld";

        $gpsToCoords := function($gps) {(
          $p := $split($gps, ",");
          [$number($trim($p[1])), $number($trim($p[0]))]
        )};
        $tagValue := function($tags, $code) { $tags.list[descriptor.code = $code].value[0] };
        $bool := function($v) { $uppercase($string($v)) = "TRUE" };
        $locality := function($stop) {(
          $parts := $split($stop.location.state.name, " ");
          $parts[1] ? $parts[1] : $stop.location.city.name
        )};

        $s0  := $ful.stops[type = "START"][0];
        $s1  := $ful.stops[type = "END"][0];
        $pay := $ord.payments[0];
        $payTags := $pay.tags;
        $variant := $ful.vehicle.variant;
        $serviceCode := $variant = "SEDAN" ? "COMFY" : $variant;
        $serviceName := $variant = "SEDAN" ? "Comfort" : $serviceCode;
        $serviceShort := $variant = "SEDAN" ? "Full size" : $serviceCode;

        {
          "context": {
            "version": "2.0.0",
            "action": "select",
            "networkId": $ctx.domain,
            "bapId": $ctx.bap_id,
            "bapUri": $ctx.bap_uri,
            "bppId": $ctx.bpp_id,
            "bppUri": $ctx.bpp_uri,
            "transactionId": $ctx.transaction_id,
            "messageId": $ctx.message_id,
            "timestamp": $ctx.timestamp,
