                    },
                    "contactPhone": $agent.contact.phone,
                    "rating": $number($tagValue($agent.person.tags, "RATING")),
                    "vehicleCategory": $ful.vehicle.category,
                    "vehicleVariant": $ful.vehicle.variant,
                    "vehicle": {
                      "color": $ful.vehicle.color,
                      "model": $ful.vehicle.model,
                      "registration": $ful.vehicle.registration
                    },
                    "customer": $cust,
                    "stops": $ful.stops,
                    "tags": $agent.person.tags
                  }
                }
              ])],
              "participants": [
                $merge([
                  { "id": "consumer-001", "descriptor": { "name": $cust.person.name } },
                  $cust ? {
                    "participantAttributes": {
                      "@context": $passCtx,
                      "@type": "Passenger",
                      "person": { "id": $cust.person.name, "name": $cust.person.name, "telephone": $cust.contact.phone }
                    }
                  } : {}
                ]),
                { "id": ($ord.provider.id ? $ord.provider.id : $ctx.bpp_id), "role": "PROVIDER" }
              ],
              "settlements": $pay ? [{
                "id": $pay.id,
                "considerationId": "consideration-1",
                "status": $v2SettleStatus,
                "settlementAttributes": {
                  "@context": $stCtx,
                  "@type": "SettlementTerm",
                  "collectedBy": $pay.collected_by,
                  "paymentStatus": $pay.status,
                  "paymentType": $pay.type,
                  "settlementAmount": $pay.params.amount,
                  "payTo": {
                    "vpa": $pay.params.bank_account_number,
                    "branchCode": $pay.params.bank_code
                  },
                  "buyerFinderFeesPercentage": $tagValue($payTags, "BUYER_FINDER_FEES_PERCENTAGE"),
                  "settlementWindow": $tagValue($payTags, "SETTLEMENT_WINDOW"),
                  "delayInterest": $tagValue($payTags, "DELAY_INTEREST"),
                  "settlementBasis": $tagValue($payTags, "SETTLEMENT_BASIS"),
                  "mandatoryArbitration": $bool($tagValue($payTags, "MANDATORY_ARBITRATION")),
                  "courtJurisdiction": $tagValue($payTags, "COURT_JURISDICTION"),
                  "staticTerms": $tagValue($payTags, "STATIC_TERMS"),
                  "tags": $pay.tags
                }
              }] : [],
              "consideration": [{
                "id": "consideration-1",
                "status": { "code": "PRICE_CONFIRMED", "name": "Confirmed fare" },
                "considerationAttributes": {
                  "@context": $fareCtx,
                  "@type": "FareEstimate",
                  "currency": $ord.quote.price.currency,
                  "offeredAmount": $number($ord.quote.price.value),
                  "price": {
                    "@context": $priceCtx,
                    "@type": "PriceSpecification",
                    "currency": $ord.quote.price.currency,
                    "value": $number($ord.quote.price.value),
                    "components": [$map($ord.quote.breakup, function($b) {{
                      "type": $pcType($b.title),
                      "value": $number($b.price.value),
                      "currency": $b.price.currency,
                      "description": $b.title
                    }})]
                  },
                  "createdAt": $ord.created_at,
                  "updatedAt": $ord.updated_at
                }
              }]
            }
          }
        }
      )

  # ─────────────────────────────────────────────────────────────────────────────
  # on_update  (ride lifecycle events: RIDE_ASSIGNED, RIDE_STARTED, etc.)
  # ─────────────────────────────────────────────────────────────────────────────

  on_update:
    bapMappings: |
      (
        $ctx      := $.context;
        $contract := $.message.contract;
        $domain   := $ctx.networkId;
        $commit   := $contract.commitments[0];
        $res      := $commit.resources[0];
        $rAttr    := $res.resourceAttributes;
        $oAttr    := $commit.offer.offerAttributes;
        $perf     := $contract.performance[0];
        $pAttr    := $perf.performanceAttributes;
        $providerPart := $contract.participants[role = "PROVIDER"][0];
        $bppPart  := $contract.participants[role = "BPP"][0];
        $settle   := $contract.settlements[0];
        $sAttr    := $settle.settlementAttributes;
        $ca       := $contract.consideration[0].considerationAttributes;

        {
          "context": {
            "version": "2.1.0",
            "action": "on_update",
            "domain": $domain,
            "bap_id":  $ctx.bapId,
            "bap_uri": $ctx.bapUri,
            "bpp_id":  $ctx.bppId,
            "bpp_uri": $ctx.bppUri,
            "transaction_id": $ctx.transactionId,
            "message_id": $ctx.messageId,
            "timestamp": $ctx.timestamp,
            "ttl": $ctx.ttl
          },
          "message": {
            "order": {
              "id": $contract.id,
              "created_at": $ca.createdAt,
              "provider": { "id": ($providerPart.id ? $providerPart.id : ($bppPart.id ? $bppPart.id : $ctx.bppId)) },
              "items": [$merge([
                {
                  "id": $commit.offer.id,
                  "descriptor": $merge([
                    $commit.offer.descriptor.name     ? { "name": $commit.offer.descriptor.name }           : {},
                    $commit.offer.descriptor.code     ? { "code": $commit.offer.descriptor.code }           : {},
                    $commit.offer.descriptor.shortDesc ? { "short_desc": $commit.offer.descriptor.shortDesc } : {}
                  ]),
                  "category_ids": $oAttr.categoryIds,
                  "fulfillment_ids": $oAttr.fulfillmentIds,
                  "payment_ids": $oAttr.paymentIds
                },
                $oAttr.itemPrice ? { "price": {
                  "currency": $oAttr.itemPrice.currency,
                  "offered_value": $oAttr.itemPrice.offeredValue,
                  "value": $oAttr.itemPrice.value
                } } : {},
                $oAttr.pricingModel.tags ? { "tags": $oAttr.pricingModel.tags } : {}
              ])],
              "fulfillments": [{
                "id": $perf.id,
                "type": $rAttr.fulfillmentType,
                "vehicle": $merge([
                  { "category": $pAttr.vehicleCategory, "variant": $pAttr.vehicleVariant },
                  $pAttr.vehicle ? $pAttr.vehicle : {}
                ]),
                "customer": $pAttr.customer,
                "stops": $pAttr.stops ? $pAttr.stops : $rAttr.stops,
                "state": { "descriptor": { "code": $perf.status.code } },
                "agent": {
                  "contact": { "phone": $pAttr.contactPhone },
                  "person": {
                    "gender": $pAttr.person.personAttributes.gender,
                    "name": $pAttr.person.name,
                    "tags": [$pAttr.tags[descriptor.code = "DRIVER_DETAILS"]]
                  }
                },
                "tags": [$pAttr.tags[descriptor.code != "DRIVER_DETAILS"]]
              }],
              "payments": $settle ? [{
                "id": $settle.id,
                "collected_by": $sAttr.collectedBy,
                "params": {
                  "amount": $sAttr.settlementAmount,
                  "bank_account_number": $sAttr.payTo.vpa,
                  "bank_code": $sAttr.payTo.branchCode,
                  "currency": $ca.currency
                },
                "status": $sAttr.paymentStatus,
                "type": $sAttr.paymentType,
                "tags": $sAttr.tags
              }] : [],
              "quote": {
                "breakup": [$map($ca.price.components, function($c) {{
                  "price": {
                    "currency": $c.currency,
                    "offered_value": $string($c.value),
                    "value": $string($c.value)
                  },
                  "title": $c.description
                }})],
                "price": {
                  "currency": $ca.currency,
                  "offered_value": $sAttr.settlementAmount,
                  "value": $sAttr.settlementAmount
                }
              },
              "cancellation_terms": [$map($oAttr.cancellationTerms, function($t) {{
                "fulfillment_state": { "descriptor": { "code": $t.fulfillmentStateCode } },
                "reason_required": $t.reasonRequired
              }})],
              "status": $contract.status.code,
              "tags": $sAttr.tags ? $map($sAttr.tags, function($grp) { $grp.descriptor.code = "SETTLEMENT_TERMS" ? $merge([$grp, { "list": $filter($grp.list, function($li) { $li.descriptor.code != "SETTLEMENT_AMOUNT" }) }]) : $grp }) : [],
              "updated_at": $ca.updatedAt
            }
          }
        }
      )
    bppMappings: |
      (
        $ctx  := $.context;
        $ord  := $.message.order;
        $ful  := $ord.fulfillments[0];
        $item := $ord.items[0];
        $pay  := $ord.payments[0];
        $cust := $ful.customer;
        $agent := $ful.agent;
        $tripCtx := "https://schema.beckn.io/TripRequest/v2.2/context.jsonld";
        $rideCtx := "https://schema.beckn.io/RideOption/v2.1/context.jsonld";
        $fareCtx := "https://schema.beckn.io/FareEstimate/v2.1/context.jsonld";
        $priceCtx := "https://schema.beckn.io/PriceSpecification/v2.2/context.jsonld";
        $pcCtx := "https://schema.beckn.io/PriceComponent/v2.2/context.jsonld";
        $stCtx   := "https://schema.beckn.io/SettlementTerm/v2.1/context.jsonld";
        $drvCtx  := "https://schema.beckn.io/Driver/v2.1/context.jsonld";

        $gpsToCoords := function($gps) {(
          $p := $split($gps, ",");
          [$number($trim($p[1])), $number($trim($p[0]))]
        )};
        $tagValue := function($tags, $code) { $tags.list[descriptor.code = $code].value[0] };
        $bool := function($v) { $uppercase($string($v)) = "TRUE" };
        $locality := function($stop) {(
          $parts := $split($stop.location.state.name, " ");
          $parts[1] ? $parts[1] : $stop.location.city.name
        )};
        $pcType := function($title) {
          $substring($title, $length($title) - 4) = "_TAX" ? "TAX" :
          $contains($title, "TOLL") ? "FEE" :
          $contains($title, "CANCELLATION") ? "FEE" :
          $contains($title, "PARKING") ? "FEE" :
          $contains($title, "VAT") ? "TAX" :
          "UNIT"
        };

        $s0 := $ful.stops[type = "START"][0];
        $s1 := $ful.stops[type = "END"][0];
        $fareTags := $item.tags;
        $payTags := $pay.tags;
        $serviceCode := $item.descriptor.name;

        $toV2Status := function($v1Code) {
          $contains($v1Code, "CANCELLED") ? "CANCELLED" :
          $contains($v1Code, "COMPLETED") ? "CLOSED" : "ACTIVE"
        };
        $v2Status := $toV2Status($ful.state.descriptor.code);
        $v2SettleStatus := $contains($ful.state.descriptor.code, "COMPLETED") ? "COMPLETE" : "COMMITTED";

        {
          "context": {
            "version": "2.0.0",
            "action": "on_update",
            "networkId": $ctx.domain,
            "bapId": $ctx.bap_id,
            "bapUri": $ctx.bap_uri,
            "bppId": $ctx.bpp_id,
            "bppUri": $ctx.bpp_uri,
            "transactionId": $ctx.transaction_id,
            "messageId": $ctx.message_id,
            "timestamp": $ctx.timestamp,
            "ttl": $ctx.ttl,
            "schemaContext": [$tripCtx, $rideCtx, $fareCtx, $priceCtx, $pcCtx, $drvCtx, "https://schema.beckn.io/Passenger/v2.1/context.jsonld", $stCtx]
          },
          "message": {
            "contract": {
              "id": $ord.id,
              "descriptor": {
                "name": $serviceCode & " ride: " & $s0.location.city.name & " → " & $s1.location.city.name,
                "shortDesc": "Ride-hailing"
              },
              "status": { "code": $v2Status, "name": "Ride in progress" },
              "commitments": [{
                "id": "commitment-1",
                "status": { "descriptor": { "code": $v2Status, "name": "Ride in progress" } },
                "resources": [{
                  "id": $item.id,
                  "descriptor": {
                    "name": $serviceCode,
                    "code": $serviceCode,
                    "shortDesc": $item.descriptor.short_desc
                  },
                  "quantity": { "value": 1, "unit": "trip" },
                  "resourceAttributes": $merge([
                    {
                      "@context": $tripCtx,
                      "@type": "TripRequest",
                      "vehicleVariant": $ful.vehicle.variant,
                      "vehicleCategory": $ful.vehicle.category,
                      "fulfillmentType": $ful.type,
                      "stops": [$map($ful.stops, function($st) { $merge([
                        { "id": $st.id, "location": $st.location, "type": $st.type },
                        $st.parent_stop_id ? { "parent_stop_id": $st.parent_stop_id } : {},
                        $st.time ? { "time": $st.time } : {},
                        $st.instructions ? { "instructions": $st.instructions } : {}
                      ]) })]
                    },
                    $s0 ? { "origin": {
                      "geo": { "type": "Point", "coordinates": $gpsToCoords($s0.location.gps) },
                      "address": {
                        "streetAddress": $s0.location.city.name,
                        "addressLocality": $locality($s0),
                        "addressRegion": $s0.location.state.name,
                        "addressCountry": $s0.location.country.name,
                        "postalCode": $s0.location.area_code
                      }
                    } } : {},
                    $s1 ? { "destination": {
                      "geo": { "type": "Point", "coordinates": $gpsToCoords($s1.location.gps) },
                      "address": {
                        "streetAddress": $s1.location.city.name,
                        "addressLocality": $locality($s1),
                        "addressRegion": $s1.location.state.name,
                        "addressCountry": $s1.location.country.name,
                        "postalCode": $s1.location.area_code
                      }
                    } } : {}
                  ])
                }],
                "offer": {
                  "id": $item.id,
                  "descriptor": {
                    "code": $item.descriptor.code,
                    "name": $item.descriptor.name,
                    "shortDesc": $item.descriptor.short_desc
                  },
                  "resourceIds": [$item.id],
                  "offerAttributes": {
                    "@context": $rideCtx,
                    "@type": "RideOption",
                    "categoryIds": $item.category_ids,
                    "fulfillmentIds": $item.fulfillment_ids,
                    "paymentIds": $item.payment_ids,
                    "itemPrice": {
                      "currency": $item.price.currency,
                      "offeredValue": $item.price.offered_value,
                      "value": $item.price.value
                    },
                    "vehicleType": { "vehicleCategoryCode": "FOUR_WHEELER" },
                    "vehicle": {
                      "bodyType": $serviceCode,
                      "seatingCapacity": 4,
                      "category": $ful.vehicle.category
                    },
                    "serviceClass": {
                      "serviceClassCode": $serviceCode,
                      "isAirConditioned": true,
                      "airConditioningScore": 2.0
                    },
                    "cancellationTerms": [$map($ord.cancellation_terms, function($t) {{
                      "fulfillmentStateCode": $t.fulfillment_state.descriptor.code,
                      "reasonRequired": $t.reason_required
                    }})],
                    "pricingModel": {
                      "currency": $item.price.currency,
                      "cancellationCharges": $tagValue($fareTags, "CANCELLATION_CHARGES"),
                      "driverMinExtraFee": $tagValue($fareTags, "DRIVER_MIN_EXTRA_FEE"),
                      "driverMaxExtraFee": $tagValue($fareTags, "DRIVER_MAX_EXTRA_FEE"),
                      "petCharges": $tagValue($fareTags, "PET_CHARGES"),
                      "nightShiftStartTime": $tagValue($fareTags, "NIGHT_SHIFT_START_TIME"),
                      "nightShiftEndTime": $tagValue($fareTags, "NIGHT_SHIFT_END_TIME"),
                      "nightShiftStartTimeInSeconds": $tagValue($fareTags, "NIGHT_SHIFT_START_TIME_IN_SECONDS"),
                      "nightShiftEndTimeInSeconds": $tagValue($fareTags, "NIGHT_SHIFT_END_TIME_IN_SECONDS"),
                      "congestionChargePercentage": $tagValue($fareTags, "CONGESTION_CHARGE_PERCENTAGE"),
                      "customerExtraFeeTaxMultiplier": $tagValue($fareTags, "CUSTOMER_EXTRA_FEE_TAX_MULTIPLIER"),
                      "baseDistance": $tagValue($fareTags, "BASE_DISTANCE"),
                      "baseFare": $tagValue($fareTags, "BASE_FARE"),
                      "deadKilometerFare": $tagValue($fareTags, "DEAD_KILOMETER_FARE"),
                      "extraPerKmFare": $tagValue($fareTags, "EXTRA_PER_KM_FARE"),
                      "extraPerKmStepFare3000Above": $tagValue($fareTags, "EXTRA_PER_KM_STEP_FARE_3000_Above"),
                      "waitingChargePerMin": $tagValue($fareTags, "WAITING_CHARGE_PER_MIN"),
                      "waitingChargeRatePerMin": $tagValue($fareTags, "WAITING_CHARGE_RATE_PER_MIN"),
                      "freeWaitingTimeInMinutes": $tagValue($fareTags, "FREE_WAITING_TIME_IN_MINUTES"),
                      "nightShiftCharge": $tagValue($fareTags, "NIGHT_SHIFT_CHARGE"),
                      "nightShiftChargePercentage": $tagValue($fareTags, "NIGHT_SHIFT_CHARGE_PERCENTAGE"),
                      "driverExtraFeeBoundsStepMinFee0Above": $tagValue($fareTags, "DRIVER_EXTRA_FEE_BOUNDS_STEP_MIN_FEE_0_Above"),
                      "driverExtraFeeBoundsStepMaxFee0Above": $tagValue($fareTags, "DRIVER_EXTRA_FEE_BOUNDS_STEP_MAX_FEE_0_Above"),
                      "tags": $item.tags
                    }
                  }
                }
              }],
              "performance": [$merge([
                {
                  "id": $ful.id,
                  "status": { "code": $ful.state.descriptor.code, "name": $ful.state.descriptor.name },
                  "commitmentIds": ["commitment-1"],
                  "performanceAttributes": {
                    "@context": $drvCtx,
                    "@type": "Driver",
                    "person": {
                      "id": $agent.person.name,
                      "name": $agent.person.name,
                      "personAttributes": { "gender": $agent.person.gender }
                    },
                    "contactPhone": $agent.contact.phone,
                    "rating": $number($tagValue($agent.person.tags, "RATING")),
                    "vehicleCategory": $ful.vehicle.category,
                    "vehicleVariant": $ful.vehicle.variant,
                    "vehicle": {
                      "color": $ful.vehicle.color,
                      "model": $ful.vehicle.model,
                      "registration": $ful.vehicle.registration
                    },
                    "customer": $cust,
                    "stops": $ful.stops,
                    "tags": $append($agent.person.tags, $ful.tags)
                  }
                }
              ])],
              "participants": [
                {
                  "id": "consumer-001",
                  "descriptor": { "name": $cust.person.name },
                  "participantAttributes": {
                    "@context": "https://schema.beckn.io/Passenger/v2.1/context.jsonld",
                    "@type": "Passenger",
                    "person": { "id": $cust.person.name, "name": $cust.person.name, "telephone": $cust.contact.phone }
                  }
                },
                { "id": ($ord.provider.id ? $ord.provider.id : $ctx.bpp_id), "role": "PROVIDER" }
              ],
              "settlements": $pay ? [{
                "id": $pay.id,
                "considerationId": "consideration-1",
                "status": $v2SettleStatus,
                "settlementAttributes": {
                  "@context": $stCtx,
                  "@type": "SettlementTerm",
                  "collectedBy": $pay.collected_by,
                  "paymentStatus": $pay.status,
                  "paymentType": $pay.type,
                  "settlementAmount": $pay.params.amount,
                  "payTo": {
                    "vpa": $pay.params.bank_account_number,
                    "branchCode": $pay.params.bank_code
                  },
                  "buyerFinderFeesPercentage": $tagValue($payTags, "BUYER_FINDER_FEES_PERCENTAGE"),
                  "settlementWindow": $tagValue($payTags, "SETTLEMENT_WINDOW"),
                  "delayInterest": $tagValue($payTags, "DELAY_INTEREST"),
                  "settlementBasis": $tagValue($payTags, "SETTLEMENT_BASIS"),
                  "mandatoryArbitration": $bool($tagValue($payTags, "MANDATORY_ARBITRATION")),
                  "courtJurisdiction": $tagValue($payTags, "COURT_JURISDICTION"),
                  "staticTerms": $tagValue($payTags, "STATIC_TERMS"),
                  "tags": $pay.tags
                }
              }] : [],
              "consideration": [{
                "id": "consideration-1",
                "status": { "code": "PRICE_CONFIRMED", "name": "Confirmed fare" },
                "considerationAttributes": {
                  "@context": $fareCtx,
                  "@type": "FareEstimate",
                  "currency": $ord.quote.price.currency,
                  "offeredAmount": $number($ord.quote.price.value),
                  "price": {
                    "@context": $priceCtx,
                    "@type": "PriceSpecification",
                    "currency": $ord.quote.price.currency,
                    "value": $number($ord.quote.price.value),
                    "components": [$map($ord.quote.breakup, function($b) {{
                      "type": $pcType($b.title),
                      "value": $number($b.price.value),
                      "currency": $b.price.currency,
                      "description": $b.title
                    }})]
                  },
                  "createdAt": $ord.created_at,
                  "updatedAt": $ord.updated_at
                }
              }]
            }
          }
        }
      )
