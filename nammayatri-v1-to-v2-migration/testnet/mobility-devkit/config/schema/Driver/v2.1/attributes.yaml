openapi: 3.1.1
info:
  title: Driver
  version: 2.1.0
  description: Schema definition for the Driver entity in the Beckn Mobility domain.
    v2.1 adds a plain numeric rating field and a verbatim tags[] array to support
    V1 ONDC TRV10 DRIVER_DETAILS tag group round-trip.
  license:
    name: CC-BY-NC-SA 4.0 International
    url: https://creativecommons.org/licenses/by-nc-sa/4.0/deed.en
  contact:
    name: Beckn Labs
    url: https://beckn.io
components:
  schemas:
    Driver:
      x-iri: https://schema.beckn.io/Driver/v2.1
      type: object
      title: Driver
      description: A person who operates a transport vehicle and is responsible for
        the safe delivery of passengers during a mobility service trip. v2.1 adds
        a plain numeric rating (DRIVER_DETAILS.RATING) and a verbatim tags[] array
        for lossless V2→V1 round-trip of the DRIVER_DETAILS tag group.
      x-tags:
        - mobility
        - ride-hailing
      properties:
        licenseNumber:
          description: Driver's license number
          type: string
        vehicleNumber:
          description: Registration number of the vehicle being driven
          type: string
        yearsOfExperience:
          description: Number of years of professional driving experience
          type: number
        id:
          description: Unique identifier for the fulfillment agent
          type: string
        person:
          description: Personal details of the agent
          $ref: https://schema.beckn.io/Person/v2.0/attributes.yaml#/components/schemas/Person
        organization:
          description: Organisation the agent belongs to
          $ref: https://schema.beckn.io/Organization/v2.0/attributes.yaml#/components/schemas/Organization
        contact:
          description: Contact information for the agent
          type: string
        rating:
          description: Numeric driver rating score (e.g. 5.00). Maps to V1
            fulfillment.agent.person.tags[DRIVER_DETAILS].RATING. Stored as number;
            the verbatim string value is preserved in tags[] for round-trip.
          type: number
        tags:
          description: V1-compatible tag groups preserved verbatim for lossless
            V2→V1 round-trip. Contains the original DRIVER_DETAILS tag group from
            V1 fulfillment.agent.person.tags. Typed extension properties above are
            derived from these tags for V2 native access; the tags array is
            authoritative for V2→V1 reconstruction.
          type: array
          items:
            type: object
            properties:
              descriptor:
                type: object
                properties:
                  code:
                    type: string
                  name:
                    type: string
              display:
                type: boolean
              list:
                type: array
                items:
                  type: object
                  properties:
                    descriptor:
                      type: object
                      properties:
                        code:
                          type: string
                        name:
                          type: string
                    display:
                      type: boolean
                    value:
                      type: string
